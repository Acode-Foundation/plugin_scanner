[package]
name = "plugin_scanner"
version = "0.4.0"
edition = "2024"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
ariadne = "0.6.0"
oxc_allocator = "0.132.0"
oxc_ast = "0.132.0"
oxc_ast_visit = "0.132.0"
oxc_parser = "0.132.0"
oxc_semantic = "0.132.0"
oxc_span = "0.132.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10"
thiserror = "2.0.17"
# Acode installs plugins with JSZip, which only understands stored and deflated
# entries. Matching that keeps the scanner from reading content the installer
# can't, and avoids pulling native compression libraries into the server build
# (zlib-rs is pure Rust). Pinned exactly because the archive reader uses
# `zip::unstable::read::ZipIterable`, the only reader that keeps duplicate
# entry names the way JSZip does.
zip = { version = "=9.5.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1"
base64 = "0.22"

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
lto = "thin"
codegen-units = 1
